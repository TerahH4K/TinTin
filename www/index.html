<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiri Poro</title>
<style>
:root{--ink:#2b2118;--card:#fff8e8;--acc:#c2410c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f3e8d2;--card:#2a231a;--acc:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f3e8d2;--card:#2a231a;--acc:#fb923c;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:#9ed4ee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;color:#fff;text-shadow:0 1px 4px #000,0 0 2px #000;font-weight:700}
#top{top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;gap:8px}
#top b{font-size:20px;letter-spacing:2px}
#top select{font:inherit;font-weight:600;border-radius:8px;border:2px solid var(--acc);background:var(--card);color:var(--ink);padding:3px 6px}
#msg{top:calc(48px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;padding:0 14px;font-size:15px}
#meter{display:none;position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:70%;max-width:340px;height:18px;transform:translateX(-50%);border-radius:9px;background:linear-gradient(90deg,#dc2626 0 25%,#facc15 25% 35%,#22c55e 35% 65%,#facc15 65% 75%,#dc2626 75%);border:3px solid #fff}
#mk{position:absolute;top:-6px;width:6px;height:26px;margin-left:-3px;background:#111;border:2px solid #fff;border-radius:3px}
#stick{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,248,232,.3);border:3px solid rgba(255,255,255,.85);touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--acc);opacity:.9}
#thr{position:fixed;right:18px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border-radius:50%;font:inherit;font-weight:800;font-size:18px;border:4px solid #fff;background:var(--acc);color:#fff;touch-action:none}
#hint{bottom:calc(160px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;opacity:.9;pointer-events:none}
#start{position:fixed;inset:0;background:linear-gradient(#e6cf7e,#d9b27c);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#7f1d1d;padding:20px;z-index:5}
#start h1{font-size:54px;letter-spacing:6px;margin:0}
#start p{max-width:340px;font-weight:600}
#start button{font:inherit;font-weight:800;font-size:22px;padding:12px 44px;border-radius:14px;border:3px solid #1f1a17;background:#dc2626;color:#fff8e8}
#start button{margin:6px}
#p2ui,#mid,#msg2{display:none}
body.two #p2ui,body.two #mid,body.two #msg2{display:block}
body.two #top,body.two #hint{display:none}
body.two #msg{top:calc(50% + 24px)}
body.two #thr{background:#2563eb}
body.two::after{content:"";position:fixed;left:0;right:0;top:calc(50% - 2px);height:4px;background:#fff;z-index:1;pointer-events:none}
#mid{left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);padding:3px 14px;border-radius:14px;font-size:14px;white-space:nowrap;z-index:2;pointer-events:none}
#msg2{left:0;right:0;bottom:calc(50% + 24px);text-align:center;padding:0 14px;font-size:15px;transform:rotate(180deg);pointer-events:none}
#p2ui{position:fixed;left:0;right:0;top:0;height:50%;transform:rotate(180deg);pointer-events:none}
#p2ui>*{pointer-events:auto}
#stick2{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(255,248,232,.3);border:3px solid rgba(255,255,255,.85);touch-action:none}
#stick2 i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#ea580c;opacity:.9}
#thr2{position:absolute;right:18px;bottom:28px;width:104px;height:104px;border-radius:50%;font:inherit;font-weight:800;font-size:18px;border:4px solid #fff;background:#ea580c;color:#fff;touch-action:none}
#meter2{display:none;position:absolute;left:50%;bottom:150px;width:70%;max-width:340px;height:18px;transform:translateX(-50%);border-radius:9px;background:linear-gradient(90deg,#dc2626 0 25%,#facc15 25% 35%,#22c55e 35% 65%,#facc15 65% 75%,#dc2626 75%);border:3px solid #fff}
#mk2{position:absolute;top:-6px;width:6px;height:26px;margin-left:-3px;background:#111;border:2px solid #fff;border-radius:3px}
#pb{display:none;position:fixed;left:8px;top:calc(44px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.45);color:#fff;font-size:16px;z-index:3}
body.play #pb{display:block}
body.two #pb{top:calc(50% - 20px)}
#msg{padding:0 56px !important}
#pm{display:none;position:fixed;inset:0;background:rgba(20,12,6,.72);z-index:6;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}
#pm h2{margin:0 0 6px;font-size:34px;letter-spacing:3px}
#pm button{font:inherit;font-weight:700;font-size:18px;padding:10px 30px;border-radius:12px;border:3px solid #fff;background:var(--acc);color:#fff;min-width:230px}
#rec{font-size:14px}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui" id="top"><b>TIRI PORO</b><span id="sc"></span><select id="diff"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>
<div class="ui" id="msg"></div>
<div id="meter"><div id="mk"></div></div>
<div class="ui" id="hint">Drag the screen to turn the camera</div>
<div id="stick"><i></i></div><button id="thr">THROW</button>
<div class="ui" id="mid"></div><div class="ui" id="msg2"></div>
<div id="p2ui"><div id="meter2"><div id="mk2"></div></div><div id="stick2"><i></i></div><button id="thr2">THROW</button></div>
<button id="pb">⏸</button>
<div id="pm"><h2>Paused</h2><button id="rs">Resume</button><button id="rm">Restart match</button><button id="sd">Sound: on</button><button id="mn">Main menu</button></div>
<div id="start"><h1>TIRI PORO</h1><p>A traditional Papua New Guinea children’s game, now in 3D. Knock the cans down with the ball, then stack all 10 before the other team hits you!</p><p id="rec"></p><button id="go">1 PLAYER</button><button id="go2">2 PLAYERS</button></div>

const ud=e=>{delete drs[e.pointerId]};cvs.addEventListener('pointerup',ud);cvs.addEventListener('pointercancel',ud);
$('thr').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();act(0)});
$('thr2').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();act(1)});
window.addEventListener('keydown',e=>{if(e.code==='Space')act(0);if(e.code==='Enter')act(1)});
function aimTarget(p){const pp=PL[p].g.position,f=fwd(p);let best=null,ba=.7;for(const k of stackers()){const dx=k.g.position.x-pp.x,dz=k.g.position.z-pp.z,d=hyp(dx,dz)||1,a=Math.acos(Math.max(-1,Math.min(1,(dx*f.x+dz*f.z)/d)));if(a<ba){ba=a;best=k}}return best}
function act(p){
 if(p===1&&!two)return;
 if(state==='open'&&!busy&&turn===p){openThrow(p,mOff)}
 else if(state==='play'&&stackTeam!==p&&cool[p]<=0&&stackers().length&&!PL[p].out){
  const k0=PL[p],pp=k0.g.position,t=aimTarget(p),f=fwd(p),T=.8;let to;
  if(t)to=new V(t.g.position.x+t.vx*T,1,t.g.position.z+t.vz*T);else to=new V(pp.x+f.x*9,.6,pp.z+f.z*9);
  kidArm(k0,to.x,to.z);launch(new V(pp.x,1.3,pp.z),to,T,p);cool[p]=.8}
}
// ---------- update ----------
function moveStacker(k,dt){
 const pl=isH(k),pi=pidx(k),p=k.g.position;let vx=0,vz=0,sp;
 if(pl){const f=fwd(pi),r={x:Math.cos(Y[pi]),z:-Math.sin(Y[pi])},Jp=J[pi];vx=f.x*-Jp.y+r.x*Jp.x;vz=f.z*-Jp.y+r.z*Jp.x;const m=hyp(vx,vz);if(m>1){vx/=m;vz/=m}sp=4.7}
 else{sp=dk(k).sp/58*3.2;
  if(!k.carry){if(!k.tgt||k.tgt.st!=='loose'){k.tgt=null;let best=1e9;for(const c of cans)if(c.st==='loose'&&(!c.by||c.by===k)){const d=hyp(c.b.position.x-p.x,c.b.position.z-p.z);if(d<best){best=d;k.tgt=c}}if(k.tgt)k.tgt.by=k}
   if(k.tgt){const dx=k.tgt.b.position.x-p.x,dz=k.tgt.b.position.z-p.z,d=hyp(dx,dz)||1;vx=dx/d;vz=dz/d}}
  else{const d=hyp(p.x,p.z)||1;vx=-p.x/d;vz=-p.z/d}
  if(dk(k).dg){let ax=0,az=0;for(const b of balls){const ox=p.x-b.p.x,oz=p.z-b.p.z,d=hyp(ox,oz),bs=hyp(b.v.x,b.v.z);if(d<5&&d>.05&&bs>1&&(ox*b.v.x+oz*b.v.z)/(d*bs)>.92){const px=-b.v.z/bs,pz2=b.v.x/bs,s=(ox*px+oz*pz2)>=0?1:-1;ax+=px*s;az+=pz2*s}}
   if(ax||az){vx+=ax*dk(k).dg*1.3;vz+=az*dk(k).dg*1.3;const m=hyp(vx,vz);if(m>1.3){vx*=1.3/m;vz*=1.3/m}}}}
 const cs=k.carry?.8:1;k.vx=vx*sp*cs;k.vz=vz*sp*cs;p.x+=k.vx*dt;p.z+=k.vz*dt;
 const dd=hyp(p.x,p.z);if(dd>7){p.x*=7/dd;p.z*=7/dd}
 if(!k.carry){let c=null;if(pl){let b=.9;for(const q of cans)if(q.st==='loose'){const d=hyp(q.b.position.x-p.x,q.b.position.z-p.z);if(d<b){b=d;c=q}}}else if(k.tgt&&hyp(k.tgt.b.position.x-p.x,k.tgt.b.position.z-p.z)<.7)c=k.tgt;
  if(c&&c.st==='loose'){c.st='held';c.by=k;k.carry=c;k.tgt=null;remW(c)}}
 else if(hyp(p.x,p.z)<1.5){const c=k.carry;k.carry=null;c.st='in';c.by=null;addW(c);setStatic(c);const s=slot(stackN);c.b.position.set(s[0],s[1],s[2]);stackN++;S.drop();if(stackN>=10)win()}
}
function step(dt){
 if(state==='title'||paused)return;
 W.step(1/60,dt,3);
 cool[0]-=dt;cool[1]-=dt;mt+=dt;mOff=Math.sin(mt*3.2);
 if(state==='pause'){pz-=dt;if(pz<=0){const f=pcb;pcb=null;f&&f()}}
 else if(state==='open'){
  if(turn===1&&!busy&&!two){aiW-=dt;if(aiW<=0){aiW=99;openThrow(1,Math.random()<dm().oc?(Math.random()-.5)*.5:(Math.random()<.5?-1:1)*(.55+Math.random()*.8))}}
  if(busy){openT-=dt;if(openT<=0&&!knocked){busy=false;msg=nm(turn)+' missed!';turn=1-turn;aiW=1.2}}
 }else if(state==='play'){
  for(const k of kids){if(k.out)continue;if(k.t===stackTeam)moveStacker(k,dt);else if(isH(k)){const pi=pidx(k),f=fwd(pi),r={x:Math.cos(Y[pi]),z:-Math.sin(Y[pi])},Jp=J[pi],p=k.g.position;p.x+=(f.x*-Jp.y+r.x*Jp.x)*4.7*dt;p.z+=(f.z*-Jp.y+r.z*Jp.x)*4.7*dt;const d=hyp(p.x,p.z);if(d<8){p.x*=8/(d||1);p.z*=8/(d||1)}if(d>14){p.x*=14/d;p.z*=14/d}}
   else{k.ang+=k.dir*.17*dt;k.g.position.set(Math.cos(k.ang)*11,0,Math.sin(k.ang)*11);k.ry=Math.atan2(-k.g.position.x,-k.g.position.z)}
   if(state!=='play')return}
  aiT-=dt;const st=stackers();
  if(aiT<=0&&st.length){const th0=kids.filter(k=>k.t!==stackTeam&&!isH(k)),th=rnd(th0),tg=rnd(st);aiT=two?.8+Math.random()*.3:((stackTeam===0)?.6:.8)*dk({t:1-stackTeam}).ti+Math.random()*.3;
   const a=th.g.position,b=tg.g.position,T=Math.max(.5,Math.min(1.1,hyp(a.x-b.x,a.z-b.z)/13)),e=dk(th).err/46*.9;
   kidArm(th,b.x,b.z);launch(new V(a.x,1.3,a.z),new V(b.x+tg.vx*T+(Math.random()-.5)*e,1,b.z+tg.vz*T+(Math.random()-.5)*e),T,th.t)}
 }
 // balls
 for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.v.y-=9.8*dt;b.p.addScaledVector(b.v,dt);b.life-=dt;
  if(b.p.y<.14){b.p.y=.14;if(b.v.y<0){b.v.y*=-.45;b.v.x*=.8;b.v.z*=.8;b.bn++}}
  b.m.position.copy(b.p);
  if(state==='open'&&busy&&!knocked&&b.p.y<1.5&&hyp(b.p.x,b.p.z)<.9)knock(b);
  else if(state==='play')for(const k of stackers())if(k.t!==b.team&&hyp(k.g.position.x-b.p.x,k.g.position.z-b.p.z)<.55&&b.p.y>.25&&b.p.y<1.8){hit(k);b.life=0;break}
  if(b.life<=0||hyp(b.p.x,b.p.z)>60){scene.remove(b.m);balls.splice(i,1)}}
 // kid visuals
 for(const k of kids){const g=k.g,sp=hyp(k.vx,k.vz);k.ph+=sp*dt*2.4;k.stp=(k.stp||0)+sp*dt;if(k.stp>1.2){k.stp=0;if(isH(k)&&!k.out)S.step()}
  if(sp>.2&&!k.out)k.ry=Math.atan2(k.vx,k.vz);
  let d=k.ry-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*Math.min(1,dt*10);
  const sw=Math.sin(k.ph)*Math.min(1,sp/2.5)*.8;k.legs[0].rotation.x=sw;k.legs[1].rotation.x=-sw;k.arms[0].rotation.x=-sw;k.arms[1].rotation.x=sw;
  if(k.thr>0){k.thr-=dt;k.arms[1].rotation.x=-2.8*Math.sin(Math.max(0,k.thr)/.3*Math.PI)}
  if(k.out){k.fall=Math.min(1,k.fall+dt*3);g.rotation.x=-k.fall*1.5;g.position.y=.14*k.fall}else{g.rotation.x=0;g.position.y=0}
  k.ring.position.set(g.position.x,.03,g.position.z);k.ring.material.opacity=1;
  if(k.carry)k.carry.m.position.set(g.position.x,1.95,g.position.z)}
 cans.forEach(c=>{if(c.st!=='held'){c.m.position.copy(c.b.position);c.m.quaternion.copy(c.b.quaternion)}else c.m.quaternion.set(0,0,0,1)});
 // cameras, markers
 for(let p=0;p<(two?2:1);p++){const tp=PL[p].g.position,cp=camP[p],c=cams[p],y=Y[p];cp.lerp(new V(tp.x,1.2,tp.z),Math.min(1,dt*5));
  const D=state==='play'?8:7,Hh=state==='play'?5.5:4.2;
  c.up.set(0,p?-1:1,0);c.position.set(cp.x+Math.sin(y)*D,Hh,cp.z+Math.cos(y)*D);
  c.lookAt(state==='open'?new V(cp.x*.5,1,cp.z*.5):new V(cp.x,1.1,cp.z));
  marks[p].visible=!PL[p].out;marks[p].position.set(tp.x,2.2+Math.sin(performance.now()/250)*.08,tp.z);
  const tg=(state==='play'&&stackTeam!==p&&!PL[p].out)?aimTarget(p):null;aims[p].visible=!!tg;if(tg)aims[p].position.set(tg.g.position.x,2.1,tg.g.position.z)}
 if(!two){marks[1].visible=false;aims[1].visible=false}
 // HUD
 const sc=nm(0)+' '+wins[0]+' \u2013 '+wins[1]+' '+nm(1);$('sc').textContent=sc;$('mid').textContent=sc;
 const a2=state==='play'?stackers().length:0;
 const tx=p=>{if(state==='play')return stackTeam===p?'Stack all 10 cans! '+stackN+'/10 \u00b7 '+a2+' of 5 still in. Dodge the ball!':'Aim with the camera and press THROW! '+stackN+'/10 \u00b7 '+a2+' of 5 still in.';
  if(state==='open'&&!busy&&turn===p)return 'Your throw! Stop the marker in the green and press THROW.';
  if(state==='open'&&!busy&&two)return 'Wait for the other player\u2019s throw\u2026';return msg};
 $('msg').textContent=tx(0);$('msg2').textContent=two?tx(1):'';
 const ms=[$('meter'),$('meter2')],mk=[$('mk'),$('mk2')],th=[$('thr'),$('thr2')];
 for(let p=0;p<2;p++){const sm=state==='open'&&turn===p&&!busy&&(p===0||two);ms[p].style.display=sm?'block':'none';if(sm)mk[p].style.left=(50+50*mOff)+'%';
  const can=state==='open'?(!busy&&turn===p):(state==='play'&&stackTeam!==p);th[p].style.opacity=can?1:.4;th[p].textContent=state==='play'&&stackTeam===p?'RUN!':'THROW'}
}
let last=performance.now(),fa=0,fn=0,qual=2;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);render();
 fa+=dt;fn++;if(fn===120){const avg=fa/fn;fa=fn=0;if(avg>.03&&!paused&&state!=='title'){if(qual===2){qual=1;pr=1;R.setPixelRatio(1);resize()}else if(qual===1){qual=0;R.shadowMap.enabled=false;sun.castShadow=false;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true})}}}
 requestAnimationFrame(loop)}
function begin(n){two=n;document.body.classList.toggle('two',n);document.body.classList.add('play');$('start').style.display='none';initAudio();resize();wins=[0,0];setupOpen()}
$('go').onclick=()=>begin(false);$('go2').onclick=()=>begin(true);
$('diff').onchange=e=>{dif=e.target.value;wins=[0,0];if(state!=='title')setupOpen()};
let paused=false;
function setPause(v){paused=v;$('pm').style.display=v?'flex':'none'}
$('pb').onclick=()=>setPause(true);$('rs').onclick=()=>setPause(false);
$('rm').onclick=()=>{setPause(false);wins=[0,0];setupOpen()};
$('sd').onclick=()=>{mute=!mute;$('sd').textContent='Sound: '+(mute?'off':'on')};
$('mn').onclick=()=>{setPause(false);two=false;wins=[0,0];state='title';document.body.classList.remove('two','play');$('start').style.display='flex';resize()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state!=='title')setPause(true)});
showRec();
requestAnimationFrame(loop);
</script></body></html>
